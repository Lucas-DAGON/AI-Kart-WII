[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kart-wii"
version = "0.1.0"
description = "AI that plays Mario Kart Wii Team Warfare through GameManager and Dolphin"
readme = "README.md"
requires-python = ">=3.11"
# No version pins on purpose (project policy: latest versions). After the first
# successful install, run `pip freeze > requirements.lock` to record what worked.
dependencies = [
    "numpy",
    "opencv-python",
    "mss",
    "pythonnet",
    "vgamepad; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pywin32; sys_platform == 'win32'"]
ml = ["torch"]
build = ["pyinstaller"]

[project.scripts]
ai-kart-wii = "ai_kart_wii.main:main"

[tool.setuptools.packages.find]
include = ["ai_kart_wii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
